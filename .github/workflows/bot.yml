name: Bot nieruchomosci

on:
  schedule:
    - cron: "7,27,47 * * * *"   # co ok. 20 min (czas UTC; GitHub potrafi opóźnić start o kilka-kilkanaście minut)
  workflow_dispatch:            # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write               # potrzebne, żeby zapisać oferty.db z powrotem do repozytorium

concurrency:
  group: bot-nieruchomosci
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sprawdź portale
        run: python bot_nieruchomosci.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Zapisz historię ofert
        if: always()
        run: |
          git config user.name "bot-nieruchomosci"
          git config user.email "bot@users.noreply.github.com"
          git add oferty.db
          git diff --cached --quiet || (git commit -m "aktualizacja ofert" && git pull --rebase && git push)
